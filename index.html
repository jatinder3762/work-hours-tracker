<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Work Hours"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg"><title>Work Hours Tracker</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}.wrap{max-width:1050px;margin:auto;padding:20px 14px}.card,.stat{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px}.auth{max-width:430px;margin:8vh auto}.form{display:grid;gap:11px}input,select,button{font:inherit}input,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:11px}button{border:0;border-radius:11px;padding:11px;font-weight:700}.primary{background:#111827;color:#fff}.secondary,.small{background:#e5e7eb}.danger{color:#b91c1c}.header,.nav,.tools,.auth-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.header{justify-content:space-between}.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.stat small,.muted,.shift small{color:#6b7280}.stat strong{display:block;font-size:28px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.section-title{display:flex;justify-content:space-between;align-items:center}.calendar-head,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.calendar-head span{text-align:center;font-size:11px;color:#6b7280}.day{min-height:68px;background:#fff;border:1px solid #e5e7eb;text-align:left;padding:7px}.day span{display:block;font-size:10px;margin-top:13px}.day.selected{background:#dbeafe}.day.blank{background:#f9fafb}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shift{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid #e5e7eb}.shift small{display:block}.small{padding:7px}.tools{margin-top:12px}.tools label{background:#e5e7eb;padding:10px;border-radius:11px;font-weight:700}.tools input{display:none}#note,#authNote{min-height:20px;font-size:13px;margin-top:6px}@media(max-width:760px){.grid{grid-template-columns:1fr}.totals{grid-template-columns:1fr 1fr}.totals .stat:last-child{grid-column:1/-1}.two{grid-template-columns:1fr}.day{min-height:55px}}</style></head><body><div class="wrap"><section id="authGate" class="card auth"><h1>Work Hours</h1><p class="muted">Sign in to securely save and sync your hours.</p><form id="authForm" class="form"><input id="email" type="email" autocomplete="email" placeholder="Email address" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" minlength="6" required><button class="primary">Sign in</button></form><div class="auth-actions" style="margin-top:8px"><button id="signupBtn" class="secondary">Create account</button><button id="resetBtn" class="secondary">Forgot password</button></div><div id="authNote"></div></section><main id="app" hidden><header class="header"><div><h1>Work Hours Tracker</h1><small id="userEmail"></small></div><button id="logoutBtn" class="secondary">Sign out</button></header><section class="totals"><div class="stat"><small>Selected week</small><strong id="weekTotal">0.00 h</strong></div><div class="stat"><small>Current month</small><strong id="monthTotal">0.00 h</strong></div><div class="stat"><small>All time</small><strong id="allTotal">0.00 h</strong></div></section><section class="grid"><div class="card"><div class="section-title"><h2 id="monthLabel">Calendar</h2><div class="nav"><button id="prevMonth" class="secondary">‹</button><button id="todayBtn" class="secondary">Today</button><button id="nextMonth" class="secondary">›</button></div></div><div class="calendar-head"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div
